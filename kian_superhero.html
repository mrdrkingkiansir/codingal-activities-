<!DOCTYPE html>
<html>
    <head>
        <title> My Superhero Card</title>
        <style>

            body {
                background-color: #118ef5;
                color: black;
                font-family: Arial, sans-serif;
                
            }

            .hero-name {
                font-size: 78px;
                font-weight: bold;
                color: blanchedalmond;
                text-shadow: 3px 3px  magenta;
            }
            
            .tagline {
                font-style: italic;
                color: azure;
                text-transform: capitalize;
            }

            .label {
                text-transform: capitalize;
                text-decoration:underline ;
                color: coral;
            }

            .power {
                font-weight: bold;
                color: azure;
            }

            .weakness {
                text-decoration: line-through;
                color: gray;
            }
            
            .badge {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }

            .made-by {
                color: coral;
                font-style:italic;
            }
        </style>
        
        <body>
            <h1 class="hero-name"> Mr Dr King Kian Sir </h1>
            <p class="tagline"> The Most powerful hero in the whole world</p>

            <h2 class="label"> Super Power</h2>
            <p class="power"> He can be Invisible</p>
            <p class="power"> He can teleport</p>

            <h2 class="label"> weaknesses</h2>
            <p class="weakness"> Too nice </p>
            <p class="weakness"> Way to helpful</p>

            <p class="badge">Top hero</p>
            <p class="made-by">Made By Kian </p>

        
            
        </body>
    </head>
</html>
