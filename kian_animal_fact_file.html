<!DOCTYPE html>
<html>
    <head>
        <title> My Animal fact file</title>
        <style>
            body {
                background-color: rgb(148, 255, 127);
                font-family: Arial, sans-serif;
                
            }
            .fact-file {
                background-color: brown;
                color: bisque;
                width: 260px;
                padding: 25px;
                border: 4x solid floralgreen;
                margin: 30px;
            }
            .animal-name {
                color: forestgreen;
                font-size: 22px;
            }
            .detail {
                color: darkslategray;
            }
            .cool-fact{
                color: darkorange;
                font-style: italic;
            }
            
        </style>
    </head>

    <body>
        <div class="fact-file">
            <h2 class="animal-name">Snow Leapord</h2>
            <p class="detail"> Type: Big Cat</p>
            <p class="detail"> Lives in mountain ranges of central asia </p>
            <p class="detail"> Diet: Deer, Goats, and wild sheep</p>
            <p class="cool-fact"> Cool fact: Can leap up to 15 meters in one jump </p>
        </div>
        
    </body>
</html>
