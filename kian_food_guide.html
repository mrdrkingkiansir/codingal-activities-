<!DOCTYPE html>
<html>
    <head>
        <title> My Food Menu </title>
        <style> 
            body {
                font-family: Arial;
                background: bisque;
                padding: 30px;
                text-align: center;
            }

            h1 { color: aquamarine;}

            h1 + p{
                background: #29e261;
                padding: 10px 20px;
                border-radius: 15px;
                color:wheat ;
                display: inline-block;
            }
            ul {padding: 0%; margin-top: 20px;}

            ul>li {
                list-style: none;
                font-size: 18px;
                font-weight: bold;
                color: chocolate;
                padding: 10px 20px;
                margin: 6px auto;
                width: 260px;
                background: chartreuse;
                border-radius: 8px;
            }

            .links {
                margin-top: 25px;
            }
            
            a {
                color: blanchedalmond;
                text-decoration: none;
                font-size: 15px;
                margin: 0 12px;
                padding: 8px 18px;
                border: 2px solid cornsilk;
                border-radius: 8px;
            }
            a:hover {
                background: gray;
                color: aquamarine;
        

            }
            


        </style>
    </head>
    
    <body>
        <h1> My Food Menu </h1>
        <p> Pick your favourite Dish and dig in </p>
        <ul>
            <li> Pizza </li>
            <li> Noodles</li>
            <li> Pasta </li>
            <li> Ice Cream </li>
            <li></li>

            
        </ul>
        <p class="desc"> Every Dish on this menu is made with lots of love please try all of them </p>

        <div class="links">
            <a href="#"> Order Now </a>
            <a href="#"> See more </a>
    
        </div>
    </body>
</html>
